services:
  - type: web
    name: black-box-ai-debugger
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_production.py
    envVars:
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 8000
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: blackbox-local-offline
      - key: DATABASE_URL
        fromDatabase:
          name: blackbox-db
          property: connectionString

databases:
  - name: blackbox-db
    databaseName: blackbox_db
    user: blackbox_user
    plan: free
