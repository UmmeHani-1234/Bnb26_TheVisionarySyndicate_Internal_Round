# ─── Render Blueprint (render.yaml) ───
# Deploy all 4 services to Render.com
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: blackbox-postgres
    plan: starter  # Free tier (90-day expiry) or starter ($7/mo)
    databaseName: blackbox
    user: blackbox
    postgresMajorVersion: "16"

services:
  # ─── 1. Backend API ───
  - type: web
    name: blackbox-backend
    runtime: python
    plan: free  # or starter for always-on
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blackbox-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # Set manually after frontend deploys
      - key: ENV
        value: production
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: blackbox-local-offline
      - key: LLM_TEMPERATURE
        value: "0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false

  # ─── 2. React Frontend ───
  - type: web
    name: blackbox-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to the backend URL after it deploys

  # ─── 3. Streamlit Dashboard ───
  - type: web
    name: blackbox-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blackbox-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: blackbox-local-offline
      - key: LLM_TEMPERATURE
        value: "0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
