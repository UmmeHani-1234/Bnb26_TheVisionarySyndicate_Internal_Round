version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: blackbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blackbox_user
      POSTGRES_PASSWORD: blackbox_password
      POSTGRES_DB: blackbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox_user -d blackbox_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackbox-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blackbox_user:blackbox_password@db:5432/blackbox_db
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-blackbox-local-offline}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      ALLOWED_ORIGINS: "*"
      PORT: 8501
      API_PORT: 8000
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - traces_data:/app/data_persist

volumes:
  postgres_data:
  traces_data:
