# ─── Full-Stack Docker Compose ───
# Usage: docker compose up --build
# All 4 services: PostgreSQL, Backend API, React Frontend, Streamlit Dashboard

version: "3.9"

services:
  # ─── 1. PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: blackbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blackbox
      POSTGRES_USER: ${POSTGRES_USER:-blackbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbox_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackbox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Backend API (FastAPI) ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blackbox-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackbox}:${POSTGRES_PASSWORD:-blackbox_secret}@postgres:5432/blackbox
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENV: production
      PORT: "8000"
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-blackbox-local-offline}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 3. React Frontend (nginx) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: blackbox-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # ─── 4. Streamlit Dashboard ───
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: blackbox-streamlit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackbox}:${POSTGRES_PASSWORD:-blackbox_secret}@postgres:5432/blackbox
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-blackbox-local-offline}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
    ports:
      - "8502:8502"

volumes:
  pgdata:
    driver: local
