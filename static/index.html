<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACK BOX | Trace Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f1f5f9;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #38bdf8;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 420px 1fr;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-content {
      overflow-y: auto;
      flex: 1;
    }
    .run-item {
      padding: 10px 14px;
      border-radius: 6px;
      background: #0f172a;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
    }
    .run-item:hover, .run-item.active {
      border-color: #38bdf8;
      background: #1e293b;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge.success { background: #065f46; color: #34d399; }
    .badge.failed, .badge.error { background: #7f1d1d; color: #f87171; }
    .badge.running { background: #1e3a8a; color: #60a5fa; }
    .step-item {
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
    }
    .step-item:hover, .step-item.active {
      border-color: #38bdf8;
    }
    .step-name {
      font-size: 0.9rem;
    }
    .detail-box {
      background: #0f172a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .detail-label {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      color: #cbd5e1;
      font-size: 0.8rem;
    }
    .run-box {
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      color: #f1f5f9;
      border-radius: 6px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0284c7; }
  </style>
</head>
<body>

  <h1>BLACK BOX</h1>
  <div class="subtitle">Agent Trace Storage & Observable Step Inspection (Phase 3 MVP)</div>

  <div class="run-box">
    <input type="text" id="queryInput" placeholder="Enter query e.g. Find a laptop under ₹70,000 for programming" value="Find a laptop under ₹70,000 for programming and gaming" />
    <button id="runBtn" onclick="triggerRun()">Run Agent & Record</button>
    <button onclick="fetchRuns()" style="background: #334155; color: #f1f5f9;">Refresh</button>
  </div>

  <div class="layout">
    <!-- PANEL 1: RECENT RUNS -->
    <div class="panel">
      <div class="panel-header">
        <span>Recent Runs</span>
      </div>
      <div class="panel-content" id="runsList">
        <div style="color: #64748b;">Loading runs...</div>
      </div>
    </div>

    <!-- PANEL 2: ORDERED EXECUTION STEPS -->
    <div class="panel">
      <div class="panel-header">
        <span id="selectedRunTitle">Run Details</span>
      </div>
      <div class="panel-content" id="stepsPanel">
        <div style="color: #64748b;">Select a run to view ordered execution steps.</div>
      </div>
    </div>

    <!-- PANEL 3: STEP OBSERVABLE DETAILS -->
    <div class="panel">
      <div class="panel-header">
        <span id="selectedStepTitle">Step Observable Details</span>
      </div>
      <div class="panel-content" id="stepDetailPanel">
        <div style="color: #64748b;">Click an individual step to inspect observable inputs, outputs, status, and timing.</div>
      </div>
    </div>
  </div>

  <script>
    let currentRuns = [];
    let currentTrace = null;
    let selectedRunId = null;

    async function fetchRuns() {
      try {
        const res = await fetch("/runs");
        currentRuns = await res.json();
        renderRuns();
        if (currentRuns.length > 0 && !selectedRunId) {
          selectRun(currentRuns[0].run_id);
        }
      } catch (e) {
        document.getElementById("runsList").innerHTML = `<div style="color:#ef4444;">Error loading runs: ${e.message}</div>`;
      }
    }

    function renderRuns() {
      const container = document.getElementById("runsList");
      if (currentRuns.length === 0) {
        container.innerHTML = '<div style="color: #64748b;">No runs stored yet. Run an agent query above.</div>';
        return;
      }
      container.innerHTML = currentRuns.map(r => `
        <div class="run-item ${r.run_id === selectedRunId ? 'active' : ''}" onclick="selectRun('${r.run_id}')">
          <div>
            <div style="font-weight:600; font-size:0.9rem;">Run #${r.run_id}</div>
            <div style="font-size:0.75rem; color:#94a3b8;">${r.started_at ? r.started_at.substring(11, 19) : ''}</div>
          </div>
          <span class="badge ${r.status}">${r.status}</span>
        </div>
      `).join("");
    }

    async function selectRun(runId) {
      selectedRunId = runId;
      renderRuns();
      const container = document.getElementById("stepsPanel");
      container.innerHTML = `<div style="color:#64748b;">Loading trace #${runId}...</div>`;

      try {
        const res = await fetch(`/runs/${runId}`);
        if (!res.ok) throw new Error("Run not found");
        currentTrace = await res.json();
        renderTrace();
      } catch (e) {
        container.innerHTML = `<div style="color:#ef4444;">Error: ${e.message}</div>`;
      }
    }

    function renderTrace() {
      document.getElementById("selectedRunTitle").innerText = `RUN #${currentTrace.run_id}`;
      const container = document.getElementById("stepsPanel");

      let html = `
        <div class="detail-box">
          <div class="detail-label">User Request</div>
          <div style="font-weight:600;">${currentTrace.user_request || "N/A"}</div>
          <div style="margin-top:6px; font-size:0.75rem; color:#94a3b8;">
            Status: <span class="badge ${currentTrace.status}">${currentTrace.status}</span>
          </div>
        </div>
        <div style="font-size:0.8rem; color:#94a3b8; margin: 8px 0 6px 2px; text-transform:uppercase; font-weight:700;">
          Ordered Execution Steps (${(currentTrace.steps || []).length})
        </div>
      `;

      if (!currentTrace.steps || currentTrace.steps.length === 0) {
        html += '<div style="color:#64748b;">No steps recorded for this run.</div>';
      } else {
        html += currentTrace.steps.map((s, idx) => {
          const icon = s.status === 'success' ? '✓' : (s.status === 'running' ? '⏳' : '✗');
          const color = s.status === 'success' ? '#34d399' : (s.status === 'running' ? '#60a5fa' : '#f87171');
          const name = s.tool_name ? `${s.step_type} (${s.tool_name})` : s.step_type;
          return `
            <div class="step-item" id="step-item-${s.step_id}" onclick="selectStep(${s.step_id})">
              <span class="step-name">${s.step_id}. ${name}</span>
              <span style="color:${color}; font-weight:700;">${icon}</span>
            </div>
          `;
        }).join("");
      }

      container.innerHTML = html;
      if (currentTrace.steps && currentTrace.steps.length > 0) {
        selectStep(currentTrace.steps[0].step_id);
      }
    }

    function selectStep(stepId) {
      if (!currentTrace || !currentTrace.steps) return;
      document.querySelectorAll(".step-item").forEach(el => el.classList.remove("active"));
      const activeEl = document.getElementById(`step-item-${stepId}`);
      if (activeEl) activeEl.classList.add("active");

      const step = currentTrace.steps.find(s => s.step_id === stepId);
      if (!step) return;

      document.getElementById("selectedStepTitle").innerText = `STEP ${step.step_id}`;
      const container = document.getElementById("stepDetailPanel");

      container.innerHTML = `
        <div class="detail-box">
          <div class="detail-label">Type</div>
          <div>${step.step_type}</div>
        </div>
        ${step.tool_name ? `
        <div class="detail-box">
          <div class="detail-label">Tool</div>
          <div style="color:#38bdf8; font-weight:600;">${step.tool_name}</div>
        </div>` : ''}
        <div class="detail-box">
          <div class="detail-label">Input</div>
          <pre>${step.input ? JSON.stringify(step.input, null, 2) : "None"}</pre>
        </div>
        <div class="detail-box">
          <div class="detail-label">Output</div>
          <pre>${step.output ? JSON.stringify(step.output, null, 2) : "None"}</pre>
        </div>
        <div class="detail-box">
          <div class="detail-label">Status</div>
          <span class="badge ${step.status}">${step.status}</span>
        </div>
        <div class="detail-box">
          <div class="detail-label">Latency</div>
          <div>${step.latency !== null && step.latency !== undefined ? `${step.latency} seconds` : "N/A"}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Timestamp</div>
          <div style="color:#94a3b8; font-size:0.8rem;">${step.timestamp}</div>
        </div>
      `;
    }

    async function triggerRun() {
      const q = document.getElementById("queryInput").value.trim();
      if (!q) return alert("Please enter a query.");
      const btn = document.getElementById("runBtn");
      btn.disabled = true;
      btn.innerText = "Running Agent...";

      try {
        const res = await fetch("/agent/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ request: q })
        });
        const data = await res.json();
        await fetchRuns();
        if (data.run_id) {
          selectRun(data.run_id);
        }
      } catch (e) {
        alert("Run failed: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Run Agent & Record";
      }
    }

    // Initial load
    fetchRuns();
  </script>
</body>
</html>
